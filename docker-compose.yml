version: '3.8'

services:
  artifice-stream:
    build: .
    container_name: artifice-stream
    restart: unless-stopped
    volumes:
      - ./cache:/app/.cache
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('.cache/live_orders.json') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a simple web server to serve the cache files
  cache-server:
    image: nginx:alpine
    container_name: artifice-cache-server
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./cache:/usr/share/nginx/html
    depends_on:
      - artifice-stream
