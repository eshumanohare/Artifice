version: '3.8'

services:
  artifice:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./cache:/app/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/orders"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
