services:
  - type: web
    name: artifice-dashboard
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    
  - type: worker
    name: artifice-stream
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 scripts/stream_orders.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12

