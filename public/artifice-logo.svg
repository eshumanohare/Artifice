<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#gradient)" stroke="url(#borderGradient)" stroke-width="4"/>
  
  <!-- Main 'A' Letter -->
  <path d="M30 85 L60 25 L90 85 L80 85 L75 70 L45 70 L40 85 L30 85 Z" fill="white"/>
  <path d="M50 55 L70 55 L65 40 L55 40 L50 55 Z" fill="url(#gradient)"/>
  
  <!-- Decorative Elements -->
  <circle cx="25" cy="35" r="3" fill="white" opacity="0.8"/>
  <circle cx="95" cy="35" r="3" fill="white" opacity="0.8"/>
  <circle cx="25" cy="85" r="2" fill="white" opacity="0.6"/>
  <circle cx="95" cy="85" r="2" fill="white" opacity="0.6"/>
  
  <!-- Financial Chart Lines -->
  <path d="M15 45 L25 40 L35 50 L45 35 L55 60 L65 45 L75 55 L85 40 L95 50" stroke="white" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1D4ED8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
